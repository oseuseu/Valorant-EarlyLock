[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valorant-earlylock"
version = "0.1.0"
description = "A PySide6 desktop app for selecting a VALORANT agent early."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "requests>=2.32,<3",
]

[project.scripts]
earlylock = "earlylock.app:main"

[tool.setuptools.packages.find]
include = ["earlylock*"]

[tool.setuptools.package-data]
"earlylock.presentation.qt" = ["forms/*.ui"]
